        <section class="page-header"><h1>👥 NPC Database</h1><p class="page-subtitle">Key characters — their locations, roles, and services</p></section>

        <div class="guide-section" style="max-width:900px;margin:0 auto">
            <h2>🔥 Old Camp</h2>
            <div class="tips-grid">
                <div class="tip-card"><h4>Diego</h4><p>Mentor / Main Quest Giver. First friendly face in the Colony. Trains Strength and Dexterity. Found on the beach path, then in Old Camp.</p></div>
                <div class="tip-card"><h4>Gomez</h4><p>Old Camp Leader. Rules with an iron fist. Controls ore trade. Final decision-maker for Old Camp admission.</p></div>
                <div class="tip-card"><h4>Thorus</h4><p>Guard Captain. Assigns combat missions and patrol routes. Key contact for Old Camp admission quests.</p></div>
                <div class="tip-card"><h4>Torrez</h4><p>Fire Mage / Magic Trainer. Sells magic items, runes, and mana upgrades. Teaches Fire Magic. Quest: "The Price of Magic" (bring 2 Wolf Claws + 1 Parchment).</p></div>
                <div class="tip-card"><h4>Scatty</h4><p>Weapon Trainer. Teaches One-Handed combat and unlocks the parry (10 LP + 50 Ore). Found at the Old Camp training grounds.</p></div>
                <div class="tip-card"><h4>Fingers</h4><p>Lockpicking Trainer. Near the arena, past Snaf's cauldron. Trained: 10 LP + 100 Ore (4 mistakes). Master: 20 LP + 200 Ore (6 mistakes).</p></div>
                <div class="tip-card"><h4>Snaf</h4><p>Cook. Complete his recipe quest to receive 3 free Meatbug Ragouts daily — renewable healing.</p></div>
                <div class="tip-card"><h4>Graham</h4><p>Map Seller. Near Old Camp north gate. Sells detailed Old Camp map and a broader Colony map.</p></div>
            </div>

            <h2>💧 New Camp</h2>
            <div class="tips-grid">
                <div class="tip-card"><h4>Lee</h4><p>Mercenary Leader. Assigns bandit and mercenary quests. Key figure for New Camp admission.</p></div>
                <div class="tip-card"><h4>Wolf</h4><p>Bow Trainer. Teaches archery and sells bows. Essential for dexterity builds.</p></div>
                <div class="tip-card"><h4>Saturas</h4><p>Water Mage Leader. Explains the Water Mage path and the secret project in the Free Mine.</p></div>
                <div class="tip-card"><h4>Swiney</h4><p>Free Mine. Gives free Digger's Dress armor — good early-game protection.</p></div>
            </div>

            <h2>🌀 Swamp Camp</h2>
            <div class="tips-grid">
                <div class="tip-card"><h4>Namib, Tyon, Orun, Cadar</h4><p>The Five Gurus. You need approval from at least 4 of 5 to join the Brotherhood. Each gives unique trials.</p></div>
                <div class="tip-card"><h4>Fortuno</h4><p>Provides 3 free Swampweed rolls daily — restores mana or can be sold for profit.</p></div>
                <div class="tip-card"><h4>Gor Na Drak</h4><p>Templar Weapon Trainer. Teaches two-handed weapons for the Templar spellsword build.</p></div>
                <div class="tip-card"><h4>Baal Parvez</h4><p>Old Camp Guru. Can escort you safely to the Swamp Camp — dangerous route, free XP from his kills.</p></div>
            </div>

            <div class="info-box warning" style="margin:2rem 0">
                <p style="line-height:1.8"><strong>⚠️ NPC Mortality:</strong> In the remake, NPCs have real daily routines and can be killed by monsters. If a key trainer dies, their services are permanently lost. Reload a save if this happens.</p>
            </div>

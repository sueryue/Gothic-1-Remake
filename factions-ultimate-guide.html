        function calculateQuizResult(){
            var scores = {'old-camp':0,'new-camp':0,'swamp':0};
            Object.values(quizAnswers).forEach(function(a){scores[a]++});
            var maxScore = 0, winner = '';
            Object.entries(scores).forEach(function(e){if(e[1] > maxScore){maxScore = e[1]; winner = e[0];}});
            var pct = Math.round((maxScore/3)*100);
            var resultDiv = document.getElementById('quizResult');
            var resultContent = document.getElementById('resultContent');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-display '+winner+'-result';

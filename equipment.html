        <section class="page-header"><h1>⚔️ Equipment Guide</h1><p class="page-subtitle">Every weapon and armor piece — by faction and rarity</p></section>

        <div class="guide-section" style="max-width:900px;margin:0 auto">
            <h2>Faction-Specific Gear</h2>
            
            <h3>🔥 Old Camp</h3>
            <p style="color:var(--color-text-secondary)">Quality armor available early. Focus on fire magic. Strongest heavy armor progression.</p>
            <ul style="color:var(--color-text-secondary);line-height:2">
                <li><strong>Shadow's Dress</strong> (Rare) — Join reward</li>
                <li><strong>Guard Captain's Sword</strong> (Epic)</li>
                <li><strong>Basic Fire Rune</strong> (Rare) — Buy from Torrez</li>
                <li><strong>Core Circle Armor</strong> (Epic)</li>
            </ul>

            <h3>💧 New Camp</h3>
            <p style="color:var(--color-text-secondary)">Unique weapons not available elsewhere. Best two-handed and ranged options. High-risk, high-reward setup.</p>
            <ul style="color:var(--color-text-secondary);line-height:2">
                <li><strong>Bandit's Dress</strong> (Rare) — Join reward</li>
                <li><strong>Heavy Two-Handed Axe</strong> (Epic)</li>
                <li><strong>Water Ring</strong> (Rare) — Freeze enchant</li>
                <li><strong>Lee's Command Sword</strong> (Epic)</li>
            </ul>

            <h3>🌀 Swamp Camp</h3>
            <p style="color:var(--color-text-secondary)">Light armor with magic bonuses. Unique spells and magical items.</p>
            <ul style="color:var(--color-text-secondary);line-height:2">
                <li><strong>Novice Robes</strong> (Rare) — Join reward (-5 DEX)</li>
                <li><strong>Templar Armor</strong> (Epic)</li>
                <li><strong>Sleeper Spell Scrolls</strong> (Rare)</li>
                <li><strong>Guru Staff</strong> (Legendary)</li>
            </ul>

            <h2>Weapon Arsenal</h2>
            <div class="table-responsive">
                <table class="faction-comparison">
                    <thead><tr><th>Weapon</th><th>Damage</th><th>Requirements</th><th>How to Get</th></tr></thead>
                    <tbody>
                        <tr><td><strong>Rusty Sword</strong></td><td>5-8</td><td>None</td><td>Found on the beach</td></tr>
                        <tr><td><strong>Old Sword</strong></td><td>8-12</td><td>STR 8</td><td>Under the hanged man, path to Old Camp</td></tr>
                        <tr><td><strong>Club</strong></td><td>6-10</td><td>None</td><td>Near Juvenile Scavenger corpse</td></tr>
                        <tr><td><strong>Hunter's Knife</strong></td><td>5-7</td><td>None</td><td>Path to Old Camp. Give to Drax for free Shortbow</td></tr>
                        <tr><td><strong>Guard's Sword</strong></td><td>12-18</td><td>STR 12</td><td>Quest reward from Thorus (Old Camp)</td></tr>
                        <tr><td><strong>Sting Mace</strong></td><td>25</td><td>STR 14</td><td>Defeat Kharim in Old Camp arena</td></tr>
                        <tr><td><strong>Rider Bow</strong></td><td>24</td><td>DEX 14</td><td>Underwater cave near Drax's camp</td></tr>
